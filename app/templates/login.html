{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}
<div class="card login"><h1>Log in</h1>
<form method="post">{{ csrf_input() }}
  <label>Username</label><input name="username" autofocus required>
  <label>Password</label><input name="password" type="password" required>
  <p><button type="submit">Log in</button></p>
</form>
<p class="muted">New customer? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div>
{% endblock %}
